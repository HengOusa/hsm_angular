<div class="mc-confirm" [attr.data-variant]="variant" data-test="confirm-dialog">
  <div class="mc-confirm__icon" aria-hidden="true">
    <mat-icon>{{ icon }}</mat-icon>
  </div>
  <h2 mat-dialog-title class="mc-h3 mc-confirm__title">{{ data.title }}</h2>
  <mat-dialog-content>
    <p class="mc-confirm__message">{{ data.message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="mc-confirm__actions">
    <button
      mat-button
      type="button"
      (click)="onCancel()"
      data-test="confirm-cancel"
    >
      {{ cancelLabel }}
    </button>
    <button
      mat-flat-button
      type="button"
      [color]="variant === 'danger' ? 'warn' : 'primary'"
      (click)="onConfirm()"
      data-test="confirm-ok"
      cdkFocusInitial
    >
      {{ confirmLabel }}
    </button>
  </mat-dialog-actions>
</div>
